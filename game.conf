# LEGO Harry Potter: Years 1-4 (engine windows/README.md, "game.conf").
GAME_ID=lhp
APP_NAME="LEGO Harry Potter Years 1-4"
APP_EXE=HarryPotterRecompiled
APP_ID=local.harrypotterrecomp
APP_SAVE_NAME=HarryPotterRecomp
APP_ENV_PREFIX=HPRECOMP
APP_GAME_FILE=LEGOHarryPotter.exe
APP_GAME_TITLE="LEGO Harry Potter: Years 1-4"
APP_IMAGE=lhp_win32.exe
GAME_REG_KEY='SOFTWARE\WB Games\LEGOHarryPotter'
BINARY_SHA256=21c2d30c07e3ac686df7b08462cc57517f599f8ddb9393ba35c01a5b7f9b16e3
LIFT_PREFIX=lhp
RECON_ANALYSIS=recon/analysis.json
RECON_SWITCH=recon/switch_tables.json
GAME_FOLDER="LEGO Harry Potter"
GOG_GLOB='LEGO*Harry*Potter*'
DATA_GLOB='GAME*.DAT'
STORE_HINT="Install LEGO Harry Potter: Years 1-4 from Steam (Windows version)"
VERSION_HINT="Only the current Steam build of LEGOHarryPotter.exe is supported. In Steam, check that the game is up to date and not on a beta branch."
POST_INSTALL_OPTION=--no-warm
POST_INSTALL_HELP="Do not build the game's shader cache after the build."

# 0 when every CachedShaders in the save folder has the stamp of this
# compiler revision (engine windows/runtime/src/d3dx_shader.c, d3dx_game_cache_stamp).
cache_is_current() {
    rev=$(sed -n 's/^#define D3DX_COMPILER_REVISION "\(.*\)"$/\1/p' "$ENGINE/windows/runtime/src/d3dx_shader.c")
    stamps=$(find "$SAVE/Users" -path '*/AppData/Roaming/*/*/CachedShaders/VERSION.DAT' 2>/dev/null) || stamps=""
    [ -n "$rev" ] && [ -n "$stamps" ] || return 1
    printf '%s\n' "$stamps" | while IFS= read -r v; do
        [ "$(cat "$(dirname "$v")/RECOMP_D3DX.TXT" 2>/dev/null)" = "$rev" ] || exit 1
    done
}

# Runs the game's shader dump routine once over every scene
# (HPRECOMP_WARM_SHADERS, runtime/src/hp_warm.c), so the first play does not
# stop to compile shaders.
post_install() {
    step "9/$STEPS Building the game's shader cache"
    SAVE="$HOME/Library/Application Support/$APP_SAVE_NAME"
    if cache_is_current; then
        echo "the shader cache is already built by this version; skipping"
        return
    fi
    FT=$(mktemp "${TMPDIR:-/tmp}/recomp-filetable.XXXXXX")
    run "$VENV/bin/python" -I "$ROOT/tools/shaders/scene_list.py" "$GAME_DIR" "$FT"
    echo "The game window opens for about 6 minutes while the game compiles its shaders."
    echo "Leave it open; it closes by itself."
    if ! run env HPRECOMP_WARM_SHADERS=1 HPRECOMP_WARM_FILETABLE="$FT" RECOMP_ASSUME_FOCUS=1 \
        "$APP/Contents/MacOS/$APP_EXE"; then
        echo "setup: the shader warm-up did not finish. The game still works; it compiles shaders as you play." >&2
        echo "Its log is in $HOME/Library/Logs/$APP_SAVE_NAME/" >&2
    fi
    rm -f "$FT"
}
